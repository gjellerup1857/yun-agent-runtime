services:
  yar:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      YAR_ADDR: :8080
      YAR_DEV_MODE: "true"
      DATABASE_URL: postgres://yar:yar_dev@postgres:5432/yar
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - yar

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: yar
      POSTGRES_PASSWORD: yar_dev
      POSTGRES_DB: yar
    ports:
      - "5432:5432"
    volumes:
      - yar_postgres:/var/lib/postgresql/data
      - ../migrations/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
      - ../migrations/002_tools.sql:/docker-entrypoint-initdb.d/002_tools.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yar -d yar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yar_postgres:
