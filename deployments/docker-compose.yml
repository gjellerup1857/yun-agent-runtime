services:
  yar:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      YAR_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: yar
      POSTGRES_PASSWORD: yar_dev
      POSTGRES_DB: yar
    ports:
      - "5432:5432"
    volumes:
      - yar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yar -d yar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yar_postgres:
