name: ci

on:
  push:
    branches:
      - main
      - 'build/**'
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Format workspace
        run: gofmt -w .
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/server

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm install
      - name: Build admin
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [go, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose -f deployments/docker-compose.yml up --build -d
      - name: Wait for YAR health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "YAR did not become healthy" >&2
          exit 1
      - name: Verify admin UI
        run: curl -fsS http://localhost:3000/ >/dev/null
      - name: Run MVP smoke flow
        run: sh scripts/smoke.sh
      - name: Container status
        if: always()
        run: docker compose -f deployments/docker-compose.yml ps
      - name: Container logs
        if: failure()
        run: docker compose -f deployments/docker-compose.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f deployments/docker-compose.yml down -v
